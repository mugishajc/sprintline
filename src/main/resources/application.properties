quarkus.application.name=task-manager-api
quarkus.http.port=8080

# In-memory H2 by default. Point QUARKUS_DATASOURCE_JDBC_URL at a file
# (jdbc:h2:file:./data/tasks) to keep data between restarts.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# API docs: /q/openapi and /q/swagger-ui (also available in prod builds)
quarkus.smallrye-openapi.info-title=Task Manager API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for managing tasks with status, priority and due dates
quarkus.swagger-ui.always-include=true
