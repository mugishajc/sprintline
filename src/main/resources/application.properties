quarkus.application.name=task-manager-api
quarkus.http.port=8080

# In-memory H2 by default. Point QUARKUS_DATASOURCE_JDBC_URL at a file
# (jdbc:h2:file:./data/tasks) to keep data between restarts.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
